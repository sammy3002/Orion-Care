<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion's Care Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#faf7f2;--card:#fff;--tx:#2b2620;--mu:#7a7268;--ac:#d9772b;--bd:#e8e1d6;--ok:#3d8b5f}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1916;--card:#26231f;--tx:#f0ebe3;--mu:#a49b8f;--ac:#f09a54;--bd:#3a352f;--ok:#63b88a}}
:root[data-theme="dark"]{--bg:#1b1916;--card:#26231f;--tx:#f0ebe3;--mu:#a49b8f;--ac:#f09a54;--bd:#3a352f;--ok:#63b88a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:15px;margin:20px 0 8px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--mu);font-size:14px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mu{color:var(--mu);font-size:13px}
b{font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:12px 4px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:600}
button.p,summary{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
button.ok{background:var(--ok)}
button.g{background:none;border:0;color:var(--mu);cursor:pointer;font-size:13px;padding:4px}
details{margin-bottom:12px}summary{list-style:none;display:inline-block}summary::-webkit-details-marker{display:none}
form,.f{display:grid;gap:8px;margin-top:10px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:15px}
label{font-size:13px;color:var(--mu);display:grid;gap:3px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
.due{color:var(--ac)}
.empty{color:var(--mu);text-align:center;padding:14px;font-size:14px}
</style></head><body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const K='orion-care-v1',TABS=[['home','🐾 Home'],['meds','💊 Meds'],['vet','🩺 Vet'],['care','📋 Care']];
let S={meds:[],doses:[],vet:[],care:[]},tab='home';
try{const r=JSON.parse(localStorage.getItem(K));if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const day=()=>new Date().toLocaleDateString('en-CA');
const v=id=>document.getElementById(id).value.trim();
const fmt=d=>d?new Date(d+'T12:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'';
const active=m=>(!m.end||m.end>=day())&&(!m.start||m.start<=day());
const given=m=>S.doses.filter(d=>d.m===m.id&&d.d===day());
const empty=t=>`<div class="empty">${t}</div>`;

function doseCard(m){const g=given(m),n=g.length,done=n>=m.per;
return `<div class="card"><div class="row"><div><b>${esc(m.name)}</b> <span class="mu">${esc(m.dose)}</span><div class="mu">${n} of ${m.per} today${g.length?' · last '+esc(g[g.length-1].t):''}</div></div>
<div><button class="p ${done?'ok':''}" onclick="give('${m.id}')">${done?'✓ Done':'Give dose'}</button>${n?`<button class="g" onclick="undo('${m.id}')">undo</button>`:''}</div></div>${m.notes?`<div class="mu">${esc(m.notes)}</div>`:''}</div>`}

function home(){
const am=S.meds.filter(active),wt=S.care.filter(c=>c.type==='Weight').sort((a,b)=>b.date.localeCompare(a.date))[0];
const up=S.vet.filter(x=>x.next&&x.next>=day()).sort((a,b)=>a.next.localeCompare(b.next));
const late=S.vet.filter(x=>x.next&&x.next<day());
return `<h1>Orion 🐱</h1><p class="sub">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}${wt?' · last weight '+esc(wt.note)+' ('+fmt(wt.date)+')':''}</p>
<h2>Today's meds</h2>${am.length?am.map(doseCard).join(''):empty('No active medications. Add one in the Meds tab.')}
<h2>Coming up</h2>${late.map(x=>`<div class="card due"><b>Overdue: ${esc(x.nextWhat||x.reason)}</b><div class="mu">was due ${fmt(x.next)}</div></div>`).join('')}
${up.map(x=>`<div class="card"><b>${esc(x.nextWhat||x.reason)}</b><div class="mu">${fmt(x.next)}</div></div>`).join('')||(late.length?'':empty('Nothing scheduled. Add a "next due" date on a vet visit.'))}`}

function meds(){return `<h1>Medications</h1>
<details><summary>+ Add medication</summary><div class="f">
<label>Name<input id="mn" placeholder="e.g. Amoxicillin"></label>
<label>Dose<input id="md" placeholder="e.g. 0.5 mL by mouth"></label>
<label>Times per day<select id="mp"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
<label>Start<input id="ms" type="date" value="${day()}"></label>
<label>End (optional)<input id="me" type="date"></label>
<label>Notes<input id="mo" placeholder="With food, etc."></label>
<button class="p" onclick="addMed()">Save</button></div></details>
${S.meds.length?S.meds.map(m=>`<div class="card"><div class="row"><div><b>${esc(m.name)}</b> <span class="mu">${esc(m.dose)}</span>
<div class="mu">${m.per}×/day · ${fmt(m.start)}${m.end?' → '+fmt(m.end):' → ongoing'} ${active(m)?'':'<span class="tag">finished</span>'}</div>${m.notes?`<div class="mu">${esc(m.notes)}</div>`:''}</div>
<button class="g" onclick="del('meds','${m.id}')">delete</button></div></div>`).join(''):empty('No medications yet.')}`}

function vet(){return `<h1>Vet records</h1>
<details><summary>+ Add visit</summary><div class="f">
<label>Date<input id="vd" type="date" value="${day()}"></label>
<label>Clinic / vet<input id="vc"></label>
<label>Reason<input id="vr" placeholder="Vaccines, checkup, spay/neuter…"></label>
<label>Notes / diagnosis<textarea id="vn" rows="3"></textarea></label>
<label>Cost ($)<input id="vx" type="number" step="0.01"></label>
<label>Next due (optional)<input id="vnx" type="date"></label>
<label>Next due for<input id="vnw" placeholder="e.g. Booster shot"></label>
<button class="p" onclick="addVet()">Save</button></div></details>
${S.vet.length?[...S.vet].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="card"><div class="row"><div><b>${esc(x.reason)}</b> <span class="mu">${fmt(x.date)}</span>
<div class="mu">${esc(x.clinic)}${x.cost?' · $'+esc(x.cost):''}</div></div><button class="g" onclick="del('vet','${x.id}')">delete</button></div>
${x.notes?`<div>${esc(x.notes)}</div>`:''}${x.next?`<div class="mu due">Next: ${esc(x.nextWhat)} ${fmt(x.next)}</div>`:''}</div>`).join(''):empty('No visits logged yet.')}`}

function care(){const T=['Weight','Vaccine','Flea/Tick','Deworming','Grooming','Litter/Diet','Symptom','Other'];
return `<h1>Care log</h1>
<details><summary>+ Add entry</summary><div class="f">
<label>Type<select id="ct">${T.map(t=>`<option>${t}</option>`).join('')}</select></label>
<label>Date<input id="cd" type="date" value="${day()}"></label>
<label>Details (e.g. 1.2 kg)<input id="cn"></label>
<button class="p" onclick="addCare()">Save</button></div></details>
${S.care.length?[...S.care].sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class="card row"><div><span class="tag">${esc(c.type)}</span> <b>${esc(c.note)}</b><div class="mu">${fmt(c.date)}</div></div><button class="g" onclick="del('care','${c.id}')">delete</button></div>`).join(''):empty('Track weight, vaccines, flea meds, symptoms and more.')}`}

function render(){
document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
const open=[...document.querySelectorAll('details')].map(d=>d.open);
document.getElementById('app').innerHTML={home,meds,vet,care}[tab]();
document.querySelectorAll('details').forEach((d,i)=>d.open=!!open[i]&&false);
}
function go(t){tab=t;render();scrollTo(0,0)}
function give(id){const m=S.meds.find(x=>x.id===id);S.doses.push({m:id,d:day(),t:new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})});save();render()}
function undo(id){const i=S.doses.map(d=>d.m===id&&d.d===day()).lastIndexOf(true);if(i>-1)S.doses.splice(i,1);save();render()}
function addMed(){const name=v('mn');if(!name)return;S.meds.push({id:uid(),name,dose:v('md'),per:+v('mp'),start:v('ms'),end:v('me'),notes:v('mo')});save();render()}
function addVet(){const reason=v('vr');if(!reason)return;S.vet.push({id:uid(),date:v('vd'),clinic:v('vc'),reason,notes:v('vn'),cost:v('vx'),next:v('vnx'),nextWhat:v('vnw')||reason});save();render()}
function addCare(){const note=v('cn');if(!note)return;S.care.push({id:uid(),type:v('ct'),date:v('cd'),note});save();render()}
function del(k,id){if(!confirm('Delete this entry?'))return;S[k]=S[k].filter(x=>x.id!==id);save();render()}
render();
</script></body></html>
